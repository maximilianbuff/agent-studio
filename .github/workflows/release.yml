name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd cli
          go build \
            -ldflags "-X main.version=${{ github.ref_name }} -s -w" \
            -o "../dist/studio_${{ matrix.goos }}_${{ matrix.goarch }}" \
            .

      - name: Archive
        run: |
          cd dist
          tar -czf "studio_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
            "studio_${{ matrix.goos }}_${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: studio_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/studio_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum studio_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/studio_*.tar.gz
            dist/checksums.txt
